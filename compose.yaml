services:
  prestaya:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Configure FLASK_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_DIR: /app/data
      SERVICE_URL_PRESTAYA_8000: /
    volumes:
      - prestaya_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  prestaya_data:
