{% extends 'base.html' %}
{% block title %}Clave de borrado{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">Configuración</p><h1>{{ 'Cambiar' if configured else 'Crear' }} clave de borrado</h1><p class="muted">Esta clave es independiente de la contraseña para ingresar al sistema.</p></div><a class="button secondary" href="{{ url_for('contract_settings') }}">Volver a configuración</a></div>
<section class="card narrow">
  <form method="post" class="form-stack" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Contraseña actual de acceso<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>Nueva clave de borrado <span class="hint">Mínimo 12 caracteres. Debe ser distinta de la contraseña de acceso.</span><input type="password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
    <label>Repita la nueva clave<input type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
    <button class="button primary" type="submit">Guardar clave</button>
  </form>
</section>
{% endblock %}
