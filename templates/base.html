<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrestaYa{% endblock %} · PrestaYa</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('user_id') %}
  <header class="topbar">
    <div class="shell nav">
      <a class="brand" href="{{ url_for('dashboard') }}"><img class="brand-logo" src="{{ url_for('static', filename='logo.svg') }}" alt=""> PrestaYa</a>
      <nav aria-label="Principal">
        <a href="{{ url_for('dashboard') }}">Inicio</a>
        <a href="{{ url_for('clients') }}">Clientes</a>
        <a href="{{ url_for('loan_new') }}">Nuevo préstamo</a>
      </nav>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="text-button" type="submit">Salir</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="shell {% if not session.get('user_id') %}login-shell{% endif %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
