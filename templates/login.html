{% extends 'base.html' %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="brand big-brand"><span class="brand-mark">P</span> PrestaYa</div>
  <h1>Bienvenido</h1>
  <p class="muted">Ingresa para gestionar clientes, préstamos y pagos.</p>
  <form method="post" class="form-stack">
    <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
